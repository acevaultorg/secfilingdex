# VALIDATE-ONLY since 2026-09-24: the CI deploy job was removed. rg-freeze-guard and its register
# exist only on the Macs, and the repo hook scripts/rg-freeze-check.mjs SKIPS (exit 0) when the guard
# is absent, so a CI deploy shipped with no freeze check. Production deploys: `npm run deploy` or the
# device-1 launchd ingest (~/.claude/bin/secfilingdex-ingest), both of which run the guard.
# GitLab CI auto-deploy secfilingdex.com to CF Pages on push to main.
# Operator one-time setup: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to project Settings > CI/CD > Variables.

stages:
  - build

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; layout.tsx loads Clarity script
  # only when this is set. Project: SecFilingDex (wk6ur3vm7m).
  NEXT_PUBLIC_CLARITY_ID: "wk6ur3vm7m"
  # GA4 measurement ID (public client-side identifier, not a secret). Baked into the
  # static export at build time. Without it CI falls back to the hardcoded default in
  # app/layout.tsx (G-5BVWDL3M45) — which is what the 2026-09-05 20:18Z CI deploy shipped,
  # silently moving analytics off the property the fleet dashboard reads. Production served
  # G-TX3XKDDE62 from local deploys through 2026-08-28 (CF deployment 764f9bec).
  NEXT_PUBLIC_GA4_ID: "G-TX3XKDDE62"

# CI-minutes cut (2026-09-24): cache npm tarballs keyed on the lockfile instead of
# node_modules/ — `npm ci` deletes node_modules/ first, so archiving and restoring
# it (~20 s per job, twice per pipeline) bought nothing. .next/cache stays cached.
cache:
  key:
    files: [package-lock.json]
  paths:
    - .npm/
    - .next/cache/

build:
  stage: build
  image: node:24-bookworm-slim
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - npm run build
    - test -d out
    - test -f out/index.html
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  only:
    - main

# Manual CI deploy (2026-10-03): build + kit inject + guards + upload on GitLab's runner (the Mac uplink measured
# ~60 KB/s). rg-freeze-guard's register exists only on the Macs: run `node ~/.claude/bin/rg-freeze-guard.mjs --site
# secfilingdex.com` locally first and play this job only when it passes. No IndexNow (kit/template deploys).
deploy:
  stage: build
  image: node:24-bookworm-slim
  allow_failure: true
  timeout: 2h
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - npm run build
    - test -f out/index.html
    - node kit/amazon-ad-inject.mjs out amazon-ad.config.mjs
    - node kit/search-inject.mjs amili-search.config.json
    - node scripts/amazon-tracking-guard.mjs
    - test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
    - |
      set -o pipefail
      npx --yes wrangler@4 pages deploy out --project-name secfilingdex --branch main --commit-dirty=true 2>&1 | tee /tmp/deploy.log
      grep -q "Deployment complete" /tmp/deploy.log
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
