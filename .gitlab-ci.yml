# GitLab CI auto-deploy secfilingdex.com to CF Pages on push to main.
# Operator one-time setup: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to project Settings > CI/CD > Variables.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; layout.tsx loads Clarity script
  # only when this is set. Project: SecFilingDex (wk6ur3vm7m).
  NEXT_PUBLIC_CLARITY_ID: "wk6ur3vm7m"
  # GA4 measurement ID (public client-side identifier, not a secret). Baked into the
  # static export at build time. Without it CI falls back to the hardcoded default in
  # app/layout.tsx (G-5BVWDL3M45) — which is what the 2026-09-05 20:18Z CI deploy shipped,
  # silently moving analytics off the property the fleet dashboard reads. Production served
  # G-TX3XKDDE62 from local deploys through 2026-08-28 (CF deployment 764f9bec).
  NEXT_PUBLIC_GA4_ID: "G-TX3XKDDE62"

cache:
  key: secfilingdex-cache
  paths:
    - node_modules/
    - .next/cache/

build:
  stage: build
  image: node:24-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - test -d out
    - test -f out/index.html
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  only:
    - main

deploy:
  stage: deploy
  image: node:24-bookworm-slim
  needs:
    - build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git
    - npm install -g wrangler@4
    # npm ci (not carried over from the build job's artifacts) so `npx tsx` for the
    # IndexNow ping below has its devDependencies — out/ alone isn't enough.
    - npm ci --no-audit --no-fund
  script:
    - test -d out
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - wrangler pages deploy out --project-name secfilingdex --branch main --commit-dirty=true
    # POST-DEPLOY ASSERTION (2026-09-21) — a zero exit from wrangler does NOT prove Cloudflare
    # published THIS commit; that green-and-wrong case is the whole reason this exists.
    # The assertion FORM was determined for this repo, not copied from a sibling: the parent
    # card predicted the "deployment URL" form because this job runs node:24-bookworm-slim and
    # a slim image has no git. That prediction is WRONG here — the before_script installs git
    # explicitly, so CF does record the SHA (deployment ed4ea652 carries 6fae0675..., exactly
    # pipeline 2861477367's CI_COMMIT_SHA). Determine the mechanism; never sample a sibling.
    # Retries because a transient 5xx from the CF API must not red a deploy that succeeded.
    - |
      set -e
      latest=""
      for attempt in 1 2 3; do
        sleep 5
        latest=$(curl -sS -m 30 \
          "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/secfilingdex/deployments?per_page=1" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const r=(j.result||[])[0]||{};process.stdout.write(String(((r.deployment_trigger||{}).metadata||{}).commit_hash||""))}catch(e){process.stdout.write("")}})') || true
        [ "$latest" = "$CI_COMMIT_SHA" ] && break
        echo "attempt $attempt: CF latest commit_hash=[$latest] != CI_COMMIT_SHA=[$CI_COMMIT_SHA]"
      done
      echo "CF latest deployment commit_hash=[$latest]  CI_COMMIT_SHA=[$CI_COMMIT_SHA]"
      if [ "$latest" != "$CI_COMMIT_SHA" ]; then
        echo "POST-DEPLOY ASSERTION FAILED: wrangler exited 0 but Cloudflare's newest deployment is not this commit."
        exit 1
      fi
      echo "post-deploy assertion OK — Cloudflare published $CI_COMMIT_SHA"
    # Found 2026-09-12: this CI deploy stage never pinged IndexNow — `npm run indexnow` was
    # only wired into the local `npm run deploy` chain, so every CI-driven ship silently
    # skipped it. The script gracefully degrades to a no-op if INDEXNOW_KEY isn't set as a
    # CI/CD variable yet (Settings > CI/CD > Variables) — it never fails the deploy.
    - npm run indexnow
  only:
    - main
