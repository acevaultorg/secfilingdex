# GitLab CI auto-deploy secfilingdex.com to CF Pages on push to main.
# Operator one-time setup: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to project Settings > CI/CD > Variables.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; layout.tsx loads Clarity script
  # only when this is set. Project: SecFilingDex (wk6ur3vm7m).
  NEXT_PUBLIC_CLARITY_ID: "wk6ur3vm7m"
  # GA4 measurement ID (public client-side identifier, not a secret). Baked into the
  # static export at build time. Without it CI falls back to the hardcoded default in
  # app/layout.tsx (G-5BVWDL3M45) — which is what the 2026-09-05 20:18Z CI deploy shipped,
  # silently moving analytics off the property the fleet dashboard reads. Production served
  # G-TX3XKDDE62 from local deploys through 2026-08-28 (CF deployment 764f9bec).
  NEXT_PUBLIC_GA4_ID: "G-TX3XKDDE62"

cache:
  key: secfilingdex-cache
  paths:
    - node_modules/
    - .next/cache/

build:
  stage: build
  image: node:24-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - test -d out
    - test -f out/index.html
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  only:
    - main

deploy:
  stage: deploy
  image: node:24-bookworm-slim
  needs:
    - build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates
    - npm install -g wrangler@4
  script:
    - test -d out
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - wrangler pages deploy out --project-name secfilingdex --branch main --commit-dirty=true
  only:
    - main
